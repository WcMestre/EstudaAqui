# PROVISÓRIO: substituir pela implementação da issue [0.1]
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estudaaqui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estudaaqui}
      POSTGRES_DB: ${POSTGRES_DB:-estudaaqui}
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-estudaaqui}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados_postgres:
